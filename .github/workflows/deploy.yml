name: Build & Deploy

# Build image di CI, bukan di VPS. Alasannya bukan sekadar konvensi:
# pernah terjadi `docker build` di VPS gagal karena Docker Hub timeout
# SETELAH container lama dihapus, dan situs mati sampai image lama
# dijalankan ulang manual. Di sini build berjalan terpisah dari mesin yang
# melayani, jadi kegagalan build tidak pernah menjatuhkan yang sedang jalan.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Dua deploy berbarengan bisa saling menimpa container. Jangan dibatalkan
  # di tengah jalan — biarkan yang berjalan selesai supaya tidak ada
  # container yatim.
  group: deploy
  cancel-in-progress: false

env:
  REGISTRI: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  uji:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang pytest
        run: pip install --quiet pytest

      - name: Jalankan seluruh test
        run: python -m pytest mesin/__tests__/ -q

      - name: Pastikan tidak ada data siswa ter-commit
        # Palang terakhir sebelum apa pun terbit. Basis data, hash sandi, dan
        # lembar terisi tidak boleh pernah masuk repo publik; .gitignore bisa
        # saja tertimpa atau dilewati dengan `git add -f`.
        run: |
          set -e
          if git ls-files | grep -iE '\.db$|sandi\.json|^lembar/|^cadangan/'; then
            echo "::error::Ada berkas data siswa ter-commit"
            exit 1
          fi
          echo "Bersih: tidak ada berkas data siswa"

  bangun:
    name: Build & Push
    needs: uji
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.dorong.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Masuk ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRI }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRI }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Bangun & dorong
        id: dorong
        uses: docker/build-push-action@v6
        with:
          context: ./mesin
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pasang:
    name: Deploy ke VPS
    needs: bangun
    runs-on: ubuntu-latest
    steps:
      - name: Siapkan kunci deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          echo "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Deploy berdasarkan digest
        # Digest, bukan tag: `latest` bisa berubah antara build dan deploy,
        # dan yang terpasang harus persis image yang baru saja lolos test.
        run: |
          set -e
          ssh -i ~/.ssh/deploy \
              -o ConnectTimeout=15 -o BatchMode=yes \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
              "${{ needs.bangun.outputs.digest }}"

      - name: Pastikan situs hidup dari luar
        # Verifikasi dari internet, bukan dari dalam VPS. Container sehat
        # belum berarti situsnya terjangkau — reverse proxy atau sertifikat
        # bisa jadi masalahnya, dan itu hanya terlihat dari luar.
        run: |
          set -e
          for i in $(seq 1 10); do
            KODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                   "https://${{ secrets.SITUS }}/" || echo 000)
            if [ "$KODE" = "401" ]; then
              echo "Situs hidup dan palang sandi aktif (401)"
              exit 0
            fi
            echo "percobaan $i: $KODE"
            sleep 6
          done
          echo "::error::Situs tidak menjawab 401 — periksa VPS"
          exit 1
