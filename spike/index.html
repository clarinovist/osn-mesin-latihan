<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spike — kanvas tinta</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 640px;
    margin: 24px auto;
    padding: 0 16px;
    color: #1a1a1a;
  }
  h1 { font-size: 18px; }
  h2 { font-size: 16px; }
  p.hint { color: #555; font-size: 14px; }
  ol#daftarSoal { list-style: none; padding: 0; }
  ol#daftarSoal li { margin-bottom: 8px; }
  ol#daftarSoal button {
    width: 100%;
    text-align: left;
    padding: 10px 12px;
  }
  ol#daftarSoal button:disabled {
    background: #eef7ee;
    color: #2a7a2a;
  }
  .langkah {
    border: 1px solid #999;
    border-radius: 4px;
    padding: 8px;
    margin-bottom: 8px;
  }
  .langkah.tersegel {
    border-color: #ccc;
    background: #fafafa;
  }
  .labelLangkah {
    font-size: 12px;
    color: #555;
    margin-bottom: 4px;
  }
  .kanvasLangkah {
    display: block;
    width: 100%;
    height: 120px;
    border: 1px solid #bbb;
    border-radius: 4px;
    touch-action: none;
    background: #fff;
  }
  .baris {
    display: flex;
    gap: 8px;
    margin: 12px 0;
    align-items: center;
  }
  button {
    font-size: 14px;
    padding: 6px 12px;
  }
  .btnHapusLangkah {
    margin-top: 6px;
    font-size: 12px;
  }
  input[type="text"] {
    font-size: 16px;
    padding: 6px 8px;
    flex: 1;
  }
  #statusUnduh { font-size: 13px; color: #333; }
  footer.privasi {
    margin-top: 32px;
    font-size: 12px;
    color: #777;
  }
</style>
</head>
<body>

  <div id="layarDaftar">
    <h1>Sesi latihan — 10 soal</h1>
    <p class="hint">Ketuk soal untuk mulai. Soal yang sudah selesai ditandai ✓.</p>
    <ol id="daftarSoal"></ol>
    <button id="btnSelesaiSesi">Selesai Sesi &amp; Unduh</button>
  </div>

  <div id="layarSoal" hidden>
    <button id="btnKembali">&larr; Kembali ke daftar (tanpa simpan)</button>
    <h2 id="judulSoal"></h2>
    <div id="daftarLangkah"></div>
    <button id="btnTambahLangkah">+ Tambah Langkah</button>
    <div class="baris">
      <label for="inputJawaban">Jawaban akhir:</label>
      <input id="inputJawaban" type="text" autocomplete="off" placeholder="mis. 11/12" />
    </div>
    <button id="btnSelesaiSoal">Selesai Soal</button>
  </div>

  <div id="layarUcapan" hidden>
    <h1>Terima kasih!</h1>
    <p>Sesi latihan sudah selesai.</p>
    <button id="btnUnduh">Unduh Data Sesi</button>
    <p id="statusUnduh"></p>
  </div>

  <footer class="privasi">
    Tidak ada koneksi jaringan dari halaman ini — semua data tetap di memori
    browser sampai diunduh secara manual.
  </footer>

  <script src="toSamples.js"></script>
  <script>
    const SOAL = [
      { soal_id: 1, teks: "Hitunglah 24 + 36 : 4 × 3 − 10." },
      { soal_id: 2, teks: "Hitunglah 2/3 + 3/4 − 1/2." },
      { soal_id: 3, teks: "Hitunglah 0,25 + 3/5 dalam bentuk desimal." },
      { soal_id: 4, teks: "Berapakah 45% dari 240?" },
      { soal_id: 5, teks: "Tentukan FPB dari 36 dan 48." },
      { soal_id: 6, teks: "Tentukan KPK dari 12 dan 18." },
      { soal_id: 8, teks: "Berapa luas persegi panjang berukuran 18 cm × 7 cm?" },
      { soal_id: 10, teks: "Berapa volume kubus dengan rusuk 8 cm?" },
      { soal_id: 13, teks: "Hitunglah 3 jam 45 menit + 2 jam 40 menit." },
      { soal_id: 15, teks: "Berapa rata-rata dari 7, 9, 12, 8, dan 14?" },
    ];

    const sesi = {
      sesi_id: new Date().toISOString(),
      soal: {},
    };

    // Statistik alat, bukan data anak — dikumpulkan lintas seluruh sesi.
    // Lihat "Rencana Spike" Bagian 1, "Risiko — fallback yang gagal diam-diam".
    let koalisi = { jumlah_event: 0, total_titik: 0, maks: 0 };
    const coalescedDidukung = typeof PointerEvent !== "undefined" &&
      typeof PointerEvent.prototype.getCoalescedEvents === "function";

    let kerja = null;

    const layarDaftar = document.getElementById("layarDaftar");
    const layarSoal = document.getElementById("layarSoal");
    const layarUcapan = document.getElementById("layarUcapan");

    function tampilkan(layar) {
      layarDaftar.hidden = layar !== layarDaftar;
      layarSoal.hidden = layar !== layarSoal;
      layarUcapan.hidden = layar !== layarUcapan;
    }

    function renderDaftarSoal() {
      const ol = document.getElementById("daftarSoal");
      ol.innerHTML = "";
      for (const s of SOAL) {
        const li = document.createElement("li");
        const selesai = !!sesi.soal[s.soal_id];
        const btn = document.createElement("button");
        btn.textContent = "Soal " + s.soal_id + (selesai ? " ✓" : "") + " · " + s.teks;
        btn.disabled = selesai;
        btn.addEventListener("click", () => bukaSoal(s));
        li.appendChild(btn);
        ol.appendChild(li);
      }
    }

    function waktuSekarangRelatif() {
      return performance.now() - kerja.t0;
    }

    function bukaSoal(soalDef) {
      kerja = {
        soal_id: soalDef.soal_id,
        t0: performance.now(),
        langkah: [],
        jawaban_diketik: "",
        jawaban_ditulis_pada_ms: null,
      };
      document.getElementById("judulSoal").textContent =
        "Soal " + soalDef.soal_id + " · " + soalDef.teks;
      document.getElementById("daftarLangkah").innerHTML = "";
      document.getElementById("inputJawaban").value = "";
      tampilkan(layarSoal);
      tambahLangkah();
    }

    function tambahLangkah() {
      const sebelumnya = kerja.langkah[kerja.langkah.length - 1];
      const sekarang = waktuSekarangRelatif();
      if (sebelumnya) sebelumnya.segel_ms = sekarang;

      const langkah = {
        indeks: kerja.langkah.length,
        buka_ms: sekarang,
        segel_ms: null,
        goresan: [],
        jumlah_hapus: 0,
      };
      kerja.langkah.push(langkah);
      renderLangkahBaru(langkah);
      bekukanLangkahLama();
    }

    function bekukanLangkahLama() {
      const kartuKartu = document.getElementById("daftarLangkah").querySelectorAll(".langkah");
      kartuKartu.forEach((el, i) => {
        if (i < kartuKartu.length - 1) {
          el.classList.add("tersegel");
          el.querySelector("canvas").style.pointerEvents = "none";
          el.querySelector(".btnHapusLangkah").disabled = true;
        }
      });
    }

    function renderLangkahBaru(langkah) {
      const wadah = document.getElementById("daftarLangkah");
      const kartu = document.createElement("div");
      kartu.className = "langkah";

      const label = document.createElement("div");
      label.className = "labelLangkah";
      label.textContent = "Langkah " + (langkah.indeks + 1);

      const canvas = document.createElement("canvas");
      canvas.className = "kanvasLangkah";

      const btnHapus = document.createElement("button");
      btnHapus.className = "btnHapusLangkah";
      btnHapus.textContent = "Hapus langkah ini";
      btnHapus.addEventListener("click", () => {
        if (langkah.segel_ms !== null) return;
        langkah.goresan = [];
        langkah.jumlah_hapus += 1;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      });

      kartu.appendChild(label);
      kartu.appendChild(canvas);
      kartu.appendChild(btnHapus);
      wadah.appendChild(kartu);

      pasangKanvas(canvas, langkah);
    }

    function pasangKanvas(canvas, langkah) {
      const ctx = canvas.getContext("2d");

      function fit() {
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#1a1a1a";
      }
      fit();
      window.addEventListener("resize", fit);

      let goresanAktif = null;

      function titikDariEvent(e) {
        const rect = canvas.getBoundingClientRect();
        return {
          clientX: e.clientX - rect.left,
          clientY: e.clientY - rect.top,
          timeStamp: e.timeStamp,
        };
      }

      canvas.addEventListener("pointerdown", (e) => {
        if (langkah.segel_ms !== null) return;
        canvas.setPointerCapture(e.pointerId);
        const samples = toSamples([titikDariEvent(e)], kerja.t0);
        goresanAktif = {
          mulai_ms: samples[0].t,
          titik: samples.map((s) => [s.x, s.y, s.t]),
        };
        ctx.beginPath();
        ctx.moveTo(samples[0].x, samples[0].y);
      });

      canvas.addEventListener("pointermove", (e) => {
        if (!goresanAktif || langkah.segel_ms !== null) return;
        const raw = e.getCoalescedEvents
          ? e.getCoalescedEvents().map(titikDariEvent)
          : [titikDariEvent(e)];
        koalisi = akumulasiKoalisi(koalisi, raw.length);
        const samples = toSamples(raw, kerja.t0);
        for (const s of samples) {
          goresanAktif.titik.push([s.x, s.y, s.t]);
          ctx.lineTo(s.x, s.y);
        }
        ctx.stroke();
      });

      function akhiriGoresan() {
        if (!goresanAktif) return;
        langkah.goresan.push(goresanAktif);
        goresanAktif = null;
      }
      canvas.addEventListener("pointerup", akhiriGoresan);
      canvas.addEventListener("pointercancel", akhiriGoresan);
    }

    document.getElementById("btnTambahLangkah").addEventListener("click", tambahLangkah);

    document.getElementById("inputJawaban").addEventListener("input", (e) => {
      kerja.jawaban_diketik = e.target.value;
      if (kerja.jawaban_ditulis_pada_ms === null && e.target.value.length > 0) {
        kerja.jawaban_ditulis_pada_ms = waktuSekarangRelatif();
      }
    });

    document.getElementById("btnKembali").addEventListener("click", () => {
      kerja = null;
      tampilkan(layarDaftar);
      renderDaftarSoal();
    });

    document.getElementById("btnSelesaiSoal").addEventListener("click", () => {
      const terakhir = kerja.langkah[kerja.langkah.length - 1];
      const sekarang = waktuSekarangRelatif();
      if (terakhir.segel_ms === null) terakhir.segel_ms = sekarang;

      sesi.soal[kerja.soal_id] = {
        soal_id: kerja.soal_id,
        langkah: kerja.langkah,
        jawaban_diketik: kerja.jawaban_diketik,
        jawaban_ditulis_pada_ms: kerja.jawaban_ditulis_pada_ms,
        selesai_ms: sekarang,
      };
      kerja = null;
      tampilkan(layarDaftar);
      renderDaftarSoal();
    });

    document.getElementById("btnSelesaiSesi").addEventListener("click", () => {
      tampilkan(layarUcapan);
    });

    document.getElementById("btnUnduh").addEventListener("click", () => {
      const ringkas = ringkasKoalisi(koalisi);
      const capture = {
        coalesced_didukung: coalescedDidukung,
        titik_per_event_rata2: ringkas.titik_per_event_rata2,
        titik_per_event_maks: ringkas.titik_per_event_maks,
        jumlah_event_pointermove: ringkas.jumlah_event_pointermove,
        browser: navigator.userAgent,
        layar_hz: null,
      };
      const data = {
        sesi_id: sesi.sesi_id,
        soal: Object.values(sesi.soal),
        capture: capture,
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const nama = "sesi-" + sesi.sesi_id.replace(/[:.]/g, "-") + ".json";

      const a = document.createElement("a");
      a.href = url;
      a.download = nama;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      const rata = capture.titik_per_event_rata2;
      const peringatan = rata > 0 && rata < 1.5
        ? " ⚠ titik/event " + rata + " — resolusi antar-frame nyaris hilang, cek Bagian 1 rencana spike."
        : " Titik/event: " + rata + ".";
      document.getElementById("statusUnduh").textContent =
        "Diunduh sebagai " + nama + " (" + Object.keys(sesi.soal).length + " dari 10 soal terisi)." + peringatan;
    });

    renderDaftarSoal();
  </script>
</body>
</html>
