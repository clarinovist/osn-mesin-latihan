<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Daftar - Caraku</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-lowest": "#ffffff",
                      "inverse-surface": "#313030",
                      "surface-dim": "#dcd9d9",
                      "primary-fixed": "#7ff5f4",
                      "on-background": "#1c1b1b",
                      "surface-container": "#f0edec",
                      "error-container": "#ffdad6",
                      "surface-bright": "#fcf9f8",
                      "secondary-fixed": "#ffdad5",
                      "surface-container-highest": "#e5e2e1",
                      "outline-variant": "#bcc9c8",
                      "surface": "#fcf9f8",
                      "on-secondary": "#ffffff",
                      "primary-fixed-dim": "#60d8d8",
                      "tertiary-container": "#c68600",
                      "secondary": "#ae3026",
                      "on-error": "#ffffff",
                      "tertiary-fixed": "#ffddb1",
                      "on-secondary-container": "#690003",
                      "on-tertiary-fixed": "#291800",
                      "secondary-fixed-dim": "#ffb4aa",
                      "inverse-primary": "#60d8d8",
                      "on-tertiary-container": "#3e2700",
                      "on-surface-variant": "#3d4949",
                      "primary": "#006a6a",
                      "outline": "#6d7a79",
                      "on-primary": "#ffffff",
                      "on-primary-fixed": "#002020",
                      "on-secondary-fixed": "#410001",
                      "secondary-container": "#fc6959",
                      "tertiary": "#815600",
                      "surface-variant": "#e5e2e1",
                      "primary-container": "#0fa3a3",
                      "on-surface": "#1c1b1b",
                      "on-tertiary-fixed-variant": "#624000",
                      "on-secondary-fixed-variant": "#8c1712",
                      "surface-container-high": "#ebe7e7",
                      "tertiary-fixed-dim": "#ffba4b",
                      "background": "#fcf9f8",
                      "on-primary-container": "#003131",
                      "on-error-container": "#93000a",
                      "on-tertiary": "#ffffff",
                      "on-primary-fixed-variant": "#004f50",
                      "inverse-on-surface": "#f3f0ef",
                      "error": "#ba1a1a",
                      "surface-container-low": "#f6f3f2",
                      "surface-tint": "#006a6a"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "touch_target": "44px",
                      "sm": "8px",
                      "xxl": "32px",
                      "xs": "4px",
                      "max_width": "46rem",
                      "lg": "16px",
                      "md": "12px",
                      "xl": "24px"
              },
              "fontFamily": {
                      "body-lg": ["Be Vietnam Pro"],
                      "headline-lg": ["Plus Jakarta Sans"],
                      "display": ["Plus Jakarta Sans"],
                      "headline-md": ["Plus Jakarta Sans"],
                      "print": ["Helvetica Neue"],
                      "body-md": ["Be Vietnam Pro"],
                      "label-md": ["Plus Jakarta Sans"]
              },
              "fontSize": {
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                      "display": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                      "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "700"}],
                      "print": ["14px", {"lineHeight": "1.5"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}]
              }
            }
          }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface-container-low min-h-screen font-body-md text-on-surface antialiased flex flex-col items-center justify-center p-lg relative overflow-hidden">
<!-- Atmospheric background blob -->
<div class="absolute top-[-10%] right-[-10%] w-[300px] h-[300px] rounded-full bg-primary-fixed/20 blur-3xl -z-10 pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[250px] h-[250px] rounded-full bg-tertiary-fixed/20 blur-3xl -z-10 pointer-events-none"></div>
<div class="w-full max-w-[24rem] bg-surface-container-lowest rounded-xl border border-outline-variant/10 shadow-sm overflow-hidden flex flex-col relative z-10">
<!-- Header -->
<div class="p-xl flex flex-col items-center gap-sm text-center">
<div class="w-16 h-16 rounded-full bg-primary-container/20 flex items-center justify-center mb-xs">
<span class="material-symbols-outlined text-[32px] text-primary" data-icon="cruelty_free" data-weight="fill">cruelty_free</span>
</div>
<h1 class="text-display font-display text-primary">Caraku</h1>
<h2 class="text-headline-lg font-headline-lg text-on-surface mt-sm">Daftar Akun</h2>
<p class="text-body-md font-body-md text-on-surface-variant">Bergabung untuk pengalaman belajar yang menyenangkan.</p>
</div>
<!-- Form Content -->
<form class="p-xl pt-0 flex flex-col gap-xl">
<!-- Inputs -->
<div class="flex flex-col gap-lg">
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface" for="nama">Nama</label>
<input class="w-full h-touch_target bg-surface-container-lowest border border-outline-variant rounded-lg px-md text-body-md font-body-md text-on-surface focus:outline-none focus:border-[2px] focus:border-primary transition-all placeholder:text-outline" id="nama" placeholder="Masukkan nama kamu" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface" for="nama_anak">Nama Anak</label>
<input class="w-full h-touch_target bg-surface-container-lowest border border-outline-variant rounded-lg px-md text-body-md font-body-md text-on-surface focus:outline-none focus:border-[2px] focus:border-primary transition-all placeholder:text-outline" id="nama_anak" placeholder="Masukkan nama anak" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface" for="sandi">Sandi</label>
<div class="relative">
<input class="w-full h-touch_target bg-surface-container-lowest border border-outline-variant rounded-lg px-md pr-[44px] text-body-md font-body-md text-on-surface focus:outline-none focus:border-[2px] focus:border-primary transition-all placeholder:text-outline" id="sandi" placeholder="Buat kata sandi yang kuat" type="password"/>
<button class="absolute right-0 top-0 h-touch_target w-touch_target flex items-center justify-center text-outline hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<!-- Role Selection -->
<div class="flex flex-col gap-sm">
<span class="text-label-md font-label-md text-on-surface">Pilih Peran</span>
<div class="grid grid-cols-2 gap-md">
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="peran" type="radio" value="pengelola"/>
<div class="h-touch_target rounded-lg border border-outline-variant bg-surface-container-lowest flex items-center justify-center text-label-md font-label-md text-on-surface-variant transition-all peer-checked:bg-tertiary-fixed peer-checked:border-tertiary peer-checked:text-on-tertiary-container peer-focus-visible:ring-2 peer-focus-visible:ring-primary peer-active:scale-[0.98]">
<span class="material-symbols-outlined text-[18px] mr-sm" data-icon="school">school</span>
                            Pengelola
                        </div>
</label>
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only" name="peran" type="radio" value="orang_tua"/>
<div class="h-touch_target rounded-lg border border-outline-variant bg-surface-container-lowest flex items-center justify-center text-label-md font-label-md text-on-surface-variant transition-all peer-checked:bg-primary-fixed peer-checked:border-primary peer-checked:text-on-primary-fixed-variant peer-focus-visible:ring-2 peer-focus-visible:ring-primary peer-active:scale-[0.98]">
<span class="material-symbols-outlined text-[18px] mr-sm" data-icon="family_restroom">family_restroom</span>
                            Orang Tua
                        </div>
</label>
</div>
</div>
<!-- Terms Checkbox -->
<label class="flex items-start gap-md cursor-pointer group select-none">
<div class="relative flex items-center justify-center w-6 h-6 mt-[2px]">
<input class="peer sr-only" required="" type="checkbox"/>
<div class="w-5 h-5 rounded-[4px] border-[2px] border-outline-variant peer-checked:bg-primary peer-checked:border-primary flex items-center justify-center transition-all peer-focus-visible:ring-2 peer-focus-visible:ring-primary peer-focus-visible:ring-offset-2 peer-focus-visible:ring-offset-surface-container-lowest bg-surface-container-lowest">
<span class="material-symbols-outlined text-[14px] text-on-primary opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check" data-weight="fill">check</span>
</div>
</div>
<span class="text-body-md font-body-md text-on-surface-variant flex-1 leading-snug cursor-pointer">
                    Saya setuju dengan <a class="text-primary hover:underline font-label-md" href="#">syarat &amp; ketentuan</a> yang berlaku.
                </span>
</label>
<!-- Submit Button -->
<button class="w-full h-touch_target rounded-[10px] bg-secondary-container text-on-error font-label-md text-label-md flex items-center justify-center transition-all hover:opacity-90 active:scale-[0.98] shadow-sm" type="submit">
                Daftar Sekarang
            </button>
</form>
<!-- Footer Link -->
<div class="p-xl pt-0 flex justify-center border-t border-outline-variant/10 mt-xs pt-lg pb-xl">
<p class="text-body-md font-body-md text-on-surface-variant">
                Sudah punya akun? <a class="text-primary font-label-md text-label-md hover:underline" href="#">Masuk</a>
</p>
</div>
</div>
</body></html>
