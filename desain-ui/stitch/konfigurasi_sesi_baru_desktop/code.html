<style>
        .custom-radio:checked + label {
            border-color: #0fa3a3;
            background-color: #e0f2f1;
        }
        .custom-radio:checked + label .radio-indicator {
            background-color: #0fa3a3;
            border-color: #0fa3a3;
        }
        .custom-radio:checked + label .radio-indicator::after {
            content: '';
            display: block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: white;
            margin: 3px auto;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar (From JSON) -->
<header class="fixed top-0 w-full h-touch_target bg-surface dark:bg-surface border-b border-outline-variant/10 z-50">
<div class="flex justify-between items-center px-lg w-full max-w-max_width mx-auto h-full">
<div class="text-headline-lg font-headline-lg text-primary flex items-center gap-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">face</span>
                Caraku
            </div>
<!-- TopAppBar Trailing Action Suppressed for this transactional form -->
<button class="text-on-surface-variant font-label-md text-label-md hover:opacity-90">Tutup</button>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow pt-xxl pb-xxl px-lg mt-[44px]">
<div class="max-w-[30rem] mx-auto bg-surface-container-lowest border border-outline-variant/10 rounded-xl p-xl shadow-sm">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xl text-center">Sesi Baru</h1>
<form class="space-y-xxl" id="sessionForm">
<!-- Mode Selection -->
<section>
<h2 class="font-label-md text-label-md text-on-surface-variant mb-md">Pilih Mode Sesi</h2>
<div class="flex flex-col gap-sm">
<!-- Mode Diagnosa -->
<div class="relative">
<input checked="" class="custom-radio sr-only peer" id="modeDiagnosa" name="sessionMode" type="radio" value="diagnosa"/>
<label class="flex items-center min-h-touch_target p-md rounded-lg border border-outline-variant bg-surface-container-lowest cursor-pointer transition-colors" for="modeDiagnosa">
<div class="radio-indicator w-5 h-5 rounded-full border-2 border-outline-variant mr-md flex-shrink-0"></div>
<div>
<span class="font-label-md text-label-md text-on-surface block">Mode Diagnosa</span>
<span class="font-body-md text-body-md text-on-surface-variant text-sm block mt-xs">Identifikasi area kelemahan secara otomatis.</span>
</div>
</label>
</div>
<!-- Mode Latihan Cepat -->
<div class="relative">
<input class="custom-radio sr-only peer" id="modeLatihan" name="sessionMode" type="radio" value="latihan"/>
<label class="flex items-center min-h-touch_target p-md rounded-lg border border-outline-variant bg-surface-container-lowest cursor-pointer transition-colors" for="modeLatihan">
<div class="radio-indicator w-5 h-5 rounded-full border-2 border-outline-variant mr-md flex-shrink-0"></div>
<div>
<span class="font-label-md text-label-md text-on-surface block">Mode Latihan Cepat</span>
<span class="font-body-md text-body-md text-on-surface-variant text-sm block mt-xs">Latihan intensif dengan pengaturan waktu.</span>
</div>
</label>
</div>
</div>
</section>
<!-- Timer Settings (Hidden by default, shown when Latihan Cepat is selected) -->
<section class="hidden space-y-md p-md bg-surface-container rounded-lg" id="timerSettings">
<h2 class="font-label-md text-label-md text-on-surface-variant mb-sm">Pengaturan Waktu</h2>
<div class="flex flex-wrap gap-md">
<label class="flex items-center gap-xs cursor-pointer min-h-touch_target">
<input checked="" class="text-primary focus:ring-primary h-5 w-5 border-outline" name="timerType" type="radio" value="none"/>
<span class="font-body-md text-body-md">Tanpa Timer</span>
</label>
<label class="flex items-center gap-xs cursor-pointer min-h-touch_target">
<input class="text-primary focus:ring-primary h-5 w-5 border-outline" name="timerType" type="radio" value="session"/>
<span class="font-body-md text-body-md">Per-Sesi</span>
</label>
<label class="flex items-center gap-xs cursor-pointer min-h-touch_target">
<input class="text-primary focus:ring-primary h-5 w-5 border-outline" name="timerType" type="radio" value="question"/>
<span class="font-body-md text-body-md">Per-Soal</span>
</label>
</div>
<div class="hidden flex-col gap-xs mt-sm" id="durationInput">
<label class="font-label-md text-label-md text-on-surface" for="duration">Durasi (Menit)</label>
<input class="min-h-touch_target rounded-lg border-outline-variant focus:border-primary focus:ring-primary bg-surface-container-lowest px-md text-body-md font-body-md w-full max-w-[150px]" id="duration" min="1" name="duration" type="number"/>
</div>
<div class="hidden mt-sm" id="autoSubmitCheck">
<label class="flex items-center gap-sm cursor-pointer min-h-touch_target">
<input class="rounded text-primary focus:ring-primary h-5 w-5 border-outline" name="autoSubmit" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface">Auto-submit ketika waktu habis</span>
</label>
</div>
</section>
<!-- Action Button -->
<div class="pt-lg">
<button class="w-full min-h-touch_target bg-secondary-container text-on-secondary-container font-label-md text-label-md rounded-[10px] hover:opacity-90 active:scale-98 transition-all flex items-center justify-center gap-sm shadow-sm" type="button">
<span class="material-symbols-outlined">play_arrow</span>
                        Buat Sesi
                    </button>
</div>
</form>
</div>
</main>
<!-- Nav Shell Omitted: This is a linear/transactional screen ('Sesi Baru') per instructions. -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const modeRadios = document.querySelectorAll('input[name="sessionMode"]');
            const timerSettings = document.getElementById('timerSettings');
            const timerRadios = document.querySelectorAll('input[name="timerType"]');
            const durationInput = document.getElementById('durationInput');
            const autoSubmitCheck = document.getElementById('autoSubmitCheck');

            // Handle Mode change
            modeRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.value === 'latihan') {
                        timerSettings.classList.remove('hidden');
                    } else {
                        timerSettings.classList.add('hidden');
                        // Reset timer settings
                        document.querySelector('input[name="timerType"][value="none"]').checked = true;
                        durationInput.classList.add('hidden');
                        autoSubmitCheck.classList.add('hidden');
                    }
                });
            });

            // Handle Timer Type change
            timerRadios.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    if (e.target.value === 'session' || e.target.value === 'question') {
                        durationInput.classList.remove('hidden');
                        durationInput.classList.add('flex');
                        autoSubmitCheck.classList.remove('hidden');
                    } else {
                        durationInput.classList.add('hidden');
                        durationInput.classList.remove('flex');
                        autoSubmitCheck.classList.add('hidden');
                    }
                });
            });
        });
    </script>
</body></html>
